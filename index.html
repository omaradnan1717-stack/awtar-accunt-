<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a2b"><title>أوتار | الإدارة المالية</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#203134;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}header{background:#102a2b;color:white;padding:23px 16px}header h1{margin:0;font-size:24px}header small{color:#c5d5d1}main{max-width:1100px;margin:auto;padding:16px}nav{display:flex;gap:8px;overflow:auto;padding:12px 0}button,.btn{border:0;border-radius:10px;background:#17685c;color:white;padding:11px 15px;font:inherit;cursor:pointer}nav button{white-space:nowrap;background:#dce9e6;color:#183e38}nav button.active{background:#17685c;color:white}.panel{background:white;padding:18px;border-radius:16px;box-shadow:0 2px 10px #153d3510;margin-bottom:14px}h2{margin:0 0 14px;font-size:19px}h3{margin:10px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:white;padding:18px;border-radius:14px;border-right:4px solid #17685c}.stat b{display:block;font-size:22px;margin-top:8px}.muted{color:#667d7a;font-size:13px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{font-size:13px;color:#526763;display:block;margin-bottom:5px}input,select{width:100%;font:inherit;padding:11px;border:1px solid #cbd9d6;border-radius:9px;background:white}form button{align-self:end}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:right;padding:11px;border-bottom:1px solid #e4ecea;font-size:14px}th{background:#eef4f2}.scroll{overflow:auto}.danger{background:#a93434}.light{background:#e6efed;color:#21483f}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.notice{padding:12px;background:#fff8e8;border-radius:10px;color:#70531c}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}@media print{header,nav,form,.no-print,button{display:none!important}main{max-width:none}.panel{box-shadow:none}body{background:white}}</style></head><body><header><div style="max-width:1100px;margin:auto"><h1>مطعم وكافيه أوتار</h1><small>نظام الإدارة المالية • الإيرادات والمصروفات والمجهزين والديون والسلف</small></div></header><main><nav id="nav"></nav><div id="app"></div></main><script>
'use strict';const KEY='awtar_finance_v1';const tabs=[['home','لوحة التحكم'],['income','الإيرادات'],['expense','المصروفات'],['suppliers','المجهزين'],['debts','الديون'],['advances','السلف'],['report','التقارير'],['backup','النسخ الاحتياطي']];let db=load(),tab='home',filterMonth=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,7);function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.entries)&&Array.isArray(x.parties))return x}catch(e){}return {entries:[],parties:[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('تعذر الحفظ. تحقق من مساحة الجهاز وإعدادات Safari.')}}const fmt=n=>Number(n||0).toLocaleString('en-US')+' د.ع',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},datefmt=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:'',id=()=>globalThis.crypto?.randomUUID?globalThis.crypto.randomUUID():String(Date.now())+Math.random(),sum=(a)=>a.reduce((s,x)=>s+Number(x.amount||0),0),entries=(type)=>db.entries.filter(x=>x.type===type),moneyField='<div><label>المبلغ (دينار عراقي)</label><input name="amount" type="number" min="1" step="1" required></div>',dateField=`<div><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div>`,noteField='<div><label>ملاحظات</label><input name="note" maxlength="300" placeholder="اختياري"></div>';function stat(name,value){return `<div class="stat"><span class="muted">${name}</span><b>${fmt(value)}</b></div>`}function render(){document.getElementById('nav').innerHTML=tabs.map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('');document.getElementById('app').innerHTML=({home:home,income:()=>ledger('income'),expense:()=>ledger('expense'),suppliers:()=>parties('supplier'),debts:()=>parties('debt'),advances:()=>parties('advance'),report,backup})[tab]()}function go(t){tab=t;render()}function home(){const m=filterMonth,ins=entries('income').filter(x=>x.date.startsWith(m)),outs=entries('expense').filter(x=>x.date.startsWith(m));return `<section class="panel topline"><h2>ملخص الشهر</h2><input style="max-width:200px" type="month" value="${m}" onchange="filterMonth=this.value;render()"></section><div class="cards">${stat('إجمالي الإيرادات',sum(ins))}${stat('إجمالي المصروفات',sum(outs))}${stat('الفرق التشغيلي',sum(ins)-sum(outs))}${stat('الرصيد النقدي المسجل',cashBalance())}</div><section class="panel" style="margin-top:14px"><h2>آخر العمليات</h2>${entryTable(db.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,12),false)}</section><div class="notice">الفرق التشغيلي ليس صافي الربح المحاسبي النهائي؛ لا يشمل تكلفة المخزون المستهلك والضرائب والتسويات. الرصيد النقدي مبني على العمليات النقدية المسجلة فقط.</div>`}function cashBalance(){return db.entries.reduce((s,e)=>s+(e.method==='نقدي'?(e.type==='income'?1:e.type==='expense'?-1:0)*e.amount:0),0)}function ledger(type){const inc=type==='income',cats=inc?['مبيعات المطعم','مبيعات الكافيه','توصيل','إيراد آخر']:['مواد غذائية','مشروبات','رواتب','إيجار','كهرباء','غاز','صيانة','نقل','مستلزمات','مصروف آخر'];return `<section class="panel"><h2>إضافة ${inc?'إيراد':'مصروف'}</h2><form onsubmit="addEntry(event,'${type}')">${dateField.replace(/value="[^"]*"/,`value="${today()}"`)}${moneyField}<div><label>التصنيف</label><select name="category">${cats.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>طريقة الدفع</label><select name="method"><option>نقدي</option><option>ماستر كارد</option><option>تحويل</option><option>توصيل / منصة</option></select></div>${noteField}<button>حفظ العملية</button></form></section><section class="panel"><div class="topline"><h2>سجل ${inc?'الإيرادات':'المصروفات'}</h2><b>${fmt(sum(entries(type)))}</b></div>${entryTable(entries(type).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created),true)}</section>`}function entryTable(a,canDelete){return `<div class="scroll"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>التصنيف</th><th>المبلغ</th><th>الطريقة</th><th>ملاحظات</th>${canDelete?'<th class="no-print">إجراء</th>':''}</tr></thead><tbody>${a.map(x=>`<tr><td>${datefmt(x.date)}</td><td>${x.type==='income'?'إيراد':'مصروف'}</td><td>${esc(x.category)}</td><td>${fmt(x.amount)}</td><td>${esc(x.method)}</td><td>${esc(x.note)}</td>${canDelete?`<td class="no-print"><button class="danger" onclick="removeEntry('${x.id}')">حذف</button></td>`:''}</tr>`).join('')||`<tr><td colspan="7">لا توجد عمليات بعد</td></tr>`}</tbody></table></div>`}function addEntry(ev,type){ev.preventDefault();const f=new FormData(ev.target),amount=Number(f.get('amount'));if(!Number.isSafeInteger(amount)||amount<=0)return alert('أدخل مبلغاً صحيحاً');db.entries.push({id:id(),created:Date.now(),type,date:f.get('date'),amount,category:f.get('category'),method:f.get('method'),note:f.get('note')});save();render()}function removeEntry(k){if(confirm('حذف العملية نهائياً؟')){db.entries=db.entries.filter(x=>x.id!==k);save();render()}}const titles={supplier:'المجهزين',debt:'الديون',advance:'السلف'},singular={supplier:'مجهز',debt:'مدين',advance:'مستلم سلفة'};function balance(p){return p.movements.reduce((s,x)=>s+(x.kind==='add'?1:-1)*Number(x.amount),0)}function parties(type){const ps=db.parties.filter(x=>x.type===type);return `<section class="panel"><h2>إضافة ${singular[type]}</h2><form onsubmit="addParty(event,'${type}')"><div><label>الاسم</label><input name="name" required maxlength="100"></div><div><label>رقم الهاتف (اختياري)</label><input name="phone" maxlength="30"></div><button>إضافة</button></form></section><section class="panel"><h2>حسابات ${titles[type]}</h2><div class="cards">${stat('مجموع الدين',ps.reduce((s,p)=>s+sum(p.movements.filter(x=>x.kind==='add')),0))}${stat('مجموع التسديد',ps.reduce((s,p)=>s+sum(p.movements.filter(x=>x.kind==='pay')),0))}${stat('المتبقي',ps.reduce((s,p)=>s+balance(p),0))}${stat('عدد الحسابات',ps.length).replace(' د.ع',' حساب')}</div>${ps.map(p=>`<div class="panel" style="border:1px solid #e1e9e7;margin-top:14px"><div class="topline"><div><h3>${esc(p.name)}</h3><span class="muted">${esc(p.phone)}</span></div><div>الدين الكلي: ${fmt(sum(p.movements.filter(x=>x.kind==='add')))}<br>التسديد: ${fmt(sum(p.movements.filter(x=>x.kind==='pay')))}<br><strong>المتبقي: ${fmt(balance(p))}</strong></div></div><form onsubmit="addMovement(event,'${p.id}')">${dateField.replace(/value="[^"]*"/,`value="${today()}"`)}${moneyField}<div><label>نوع الحركة</label><select name="kind"><option value="add">${type==='supplier'?'مشتريات على الحساب':'إضافة مبلغ مستحق'}</option><option value="pay">${type==='supplier'?'تسديد للمجهز':'تسديد / استرجاع'}</option></select></div>${noteField}<button>تسجيل الحركة</button></form><div class="scroll"><table><thead><tr><th>التاريخ</th><th>الحركة</th><th>المبلغ</th><th>ملاحظات</th><th class="no-print">إجراء</th></tr></thead><tbody>${p.movements.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${datefmt(x.date)}</td><td>${x.kind==='add'?'إضافة':'تسديد'}</td><td>${fmt(x.amount)}</td><td>${esc(x.note)}</td><td class="no-print"><button class="danger" onclick="removeMovement('${p.id}','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد حركات</td></tr>'}</tbody></table></div><div class="actions no-print" style="margin-top:12px"><button class="light" onclick="printParty('${p.id}')">طباعة كشف الحساب</button><button onclick="sharePartyWhatsApp('${p.id}')">إرسال عبر واتساب</button><button class="danger" onclick="removeParty('${p.id}')">حذف الحساب</button></div></div>`).join('')||'<p class="muted">لا توجد حسابات مسجلة</p>'}</section><div class="notice">حسابات المجهزين والديون والسلف مستقلة عن الإيرادات والمصروفات النقدية؛ سجل المدفوعات النقدية أيضاً بقسم المصروفات أو الإيرادات عند الحاجة، لتنعكس في رصيد الصندوق. تجنب تسجيل نفس العملية مرتين في القسم نفسه.</div>`}function addParty(e,type){e.preventDefault();const f=new FormData(e.target);if(!f.get('name').trim())return alert('أدخل الاسم');db.parties.push({id:id(),type,name:f.get('name').trim(),phone:f.get('phone').trim(),movements:[]});save();render()}function addMovement(e,pid){e.preventDefault();const p=db.parties.find(x=>x.id===pid),f=new FormData(e.target),amount=Number(f.get('amount'));if(!Number.isSafeInteger(amount)||amount<=0)return alert('المبلغ غير صحيح');if(f.get('kind')==='pay'&&amount>balance(p)&&!confirm('التسديد أكبر من الرصيد المستحق. متابعة؟'))return;p.movements.push({id:id(),date:f.get('date'),amount,kind:f.get('kind'),note:f.get('note')});save();render()}function removeMovement(pid,mid){if(confirm('حذف الحركة؟')){db.parties.find(x=>x.id===pid).movements=db.parties.find(x=>x.id===pid).movements.filter(x=>x.id!==mid);save();render()}}function removeParty(pid){const p=db.parties.find(x=>x.id===pid);if(p.movements.length)return alert('احذف حركات الحساب أولاً للحفاظ على السجل');if(confirm('حذف الحساب؟')){db.parties=db.parties.filter(x=>x.id!==pid);save();render()}}function printParty(pid){const p=db.parties.find(x=>x.id===pid),w=window.open('','_blank');if(!w)return alert('اسمح بالنوافذ المنبثقة للطباعة');w.document.write(`<html dir="rtl"><meta charset="utf-8"><title>كشف حساب</title><style>body{font-family:Arial;padding:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #aaa;padding:9px;text-align:right}</style><h2>مطعم وكافيه أوتار - كشف حساب ${esc(p.name)}</h2><h3>الرصيد: ${fmt(balance(p))}</h3><table><tr><th>التاريخ</th><th>الحركة</th><th>المبلغ</th><th>ملاحظات</th></tr>${p.movements.map(x=>`<tr><td>${datefmt(x.date)}</td><td>${x.kind==='add'?'إضافة':'تسديد'}</td><td>${fmt(x.amount)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}function report(){return `<section class="panel"><h2>تقرير العمليات المالية</h2><form onsubmit="event.preventDefault();showReport()"><div><label>من تاريخ</label><input id="from" type="date" value="${today().slice(0,7)}-01" required></div><div><label>إلى تاريخ</label><input id="to" type="date" value="${today()}" required></div><button>عرض التقرير</button></form></section><section id="reportResult" class="panel"></section>`}function showReport(){const from=document.getElementById('from').value,to=document.getElementById('to').value;if(from>to)return alert('تاريخ البداية بعد النهاية');const a=db.entries.filter(x=>x.date>=from&&x.date<=to).sort((x,y)=>x.date.localeCompare(y.date)),ins=sum(a.filter(x=>x.type==='income')),outs=sum(a.filter(x=>x.type==='expense'));document.getElementById('reportResult').innerHTML=`<div class="topline"><h2>من ${datefmt(from)} إلى ${datefmt(to)}</h2><div class="actions no-print"><button onclick="window.print()">طباعة</button><button onclick="exportCSV('${from}','${to}')">تصدير CSV / Excel</button></div></div><div class="cards">${stat('الإيرادات',ins)}${stat('المصروفات',outs)}${stat('الفرق',ins-outs)}</div><h3>تفاصيل العمليات</h3>${entryTable(a,false)}`}function exportCSV(from,to){const a=db.entries.filter(x=>x.date>=from&&x.date<=to),rows=[['التاريخ','النوع','التصنيف','المبلغ','طريقة الدفع','ملاحظات'],...a.map(x=>[datefmt(x.date),x.type==='income'?'إيراد':'مصروف',x.category,x.amount,x.method,x.note])];download('\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'awtar-report.csv','text/csv;charset=utf-8')}function backup(){return `<section class="panel"><h2>النسخ الاحتياطي</h2><p>صدّر جميع البيانات إلى ملف JSON، واحفظه في تطبيق الملفات أو iCloud Drive. يمكنك استرجاعه لاحقاً.</p><div class="actions"><button onclick="download(JSON.stringify(db,null,2),'awtar-backup-${today()}.json','application/json')">تنزيل نسخة احتياطية</button></div><h3>استرجاع نسخة</h3><p class="notice">الاسترجاع يستبدل جميع البيانات الحالية. نزّل نسخة احتياطية أولاً.</p><input type="file" id="restore" accept=".json,application/json"><button style="margin-top:12px" onclick="restore()">استرجاع البيانات</button></section><section class="panel"><h2>معلومات الحفظ</h2><p>البيانات محفوظة داخل متصفح هذا الجهاز فقط، وقد تُفقد عند مسح بيانات Safari أو استخدام التصفح الخاص. النسخة لا تحتوي على تسجيل دخول أو مزامنة بين الأجهزة.</p></section>`}function download(content,name,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}async function restore(){const file=document.getElementById('restore').files[0];if(!file)return alert('اختر ملف النسخة الاحتياطية');try{const x=JSON.parse(await file.text());if(!x||!Array.isArray(x.entries)||!Array.isArray(x.parties)||!x.entries.every(e=>['income','expense'].includes(e.type)&&Number.isSafeInteger(e.amount)&&e.amount>0&&typeof e.date==='string')||!x.parties.every(p=>['supplier','debt','advance'].includes(p.type)&&Array.isArray(p.movements)&&p.movements.every(m=>['add','pay'].includes(m.kind)&&Number.isSafeInteger(m.amount)&&m.amount>0)))throw Error('invalid');if(!confirm('استبدال كل البيانات الحالية ببيانات الملف؟'))return;db=x;save();render();alert('تم الاسترجاع')}catch(e){alert('الملف غير صالح أو غير متوافق')}}
function closeStatement(){document.getElementById('statementView')?.remove();document.querySelector('main').classList.remove('hidden')}
function openStatement(title,content){closeStatement();const v=document.createElement('section');v.id='statementView';v.className='panel';v.style.margin='16px';v.innerHTML=`<div class="actions no-print"><button onclick="window.print()">طباعة / حفظ PDF</button><button class="light" onclick="closeStatement()">رجوع</button></div><h2 style="margin-top:20px">مطعم وكافيه أوتار — ${esc(title)}</h2>${content}`;document.body.append(v);document.querySelector('main').classList.add('hidden');window.scrollTo(0,0)}
printParty=function(pid){const p=db.parties.find(p=>p.id===pid);if(!p)return alert('الحساب غير موجود');let running=0;const rows=p.movements.slice().sort((a,b)=>a.date.localeCompare(b.date));openStatement('كشف حساب '+p.name,`<p>${esc(p.phone)}</p><div class="cards">${stat('الدين الكلي',sum(p.movements.filter(x=>x.kind==='add')))}${stat('مجموع التسديد',sum(p.movements.filter(x=>x.kind==='pay')))}${stat('المتبقي',balance(p))}</div><div class="scroll"><table><thead><tr><th>التاريخ</th><th>الحركة</th><th>المبلغ</th><th>الرصيد</th><th>ملاحظات</th></tr></thead><tbody>${rows.map(x=>{running+=(x.kind==='add'?1:-1)*Number(x.amount);return `<tr><td>${datefmt(x.date)}</td><td>${x.kind==='add'?'إضافة':'تسديد'}</td><td>${fmt(x.amount)}</td><td>${fmt(running)}</td><td>${esc(x.note)}</td></tr>`}).join('')||'<tr><td colspan="5">لا توجد حركات</td></tr>'}</tbody></table></div>`)};
function printLedger(type){const a=entries(type).slice().sort((a,b)=>a.date.localeCompare(b.date));openStatement(type==='expense'?'كشف المصروفات':'كشف الإيرادات',`<h3>الإجمالي: ${fmt(sum(a))}</h3>${entryTable(a,false)}`)}
const originalLedger=ledger;ledger=function(type){return originalLedger(type)+`<div class="actions no-print"><button onclick="printLedger('${type}')">عرض كشف الحساب / طباعة</button></div>`};
const originalSave=save;save=function(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('تعذر حفظ التغيير. نزّل نسخة احتياطية قبل إغلاق البرنامج.');return false}};
const originalRestore=restore;
function validDB(x){const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d;const ids=new Set();const validId=o=>typeof o.id==='string'&&/^[a-zA-Z0-9_.-]+$/.test(o.id)&&!ids.has(o.id)&&!!ids.add(o.id);return x&&Array.isArray(x.entries)&&Array.isArray(x.parties)&&x.entries.every(e=>validId(e)&&['income','expense'].includes(e.type)&&Number.isSafeInteger(e.amount)&&e.amount>0&&validDate(e.date))&&x.parties.every(p=>validId(p)&&typeof p.name==='string'&&p.name.trim()&&['supplier','debt','advance'].includes(p.type)&&Array.isArray(p.movements)&&p.movements.every(m=>validId(m)&&['add','pay'].includes(m.kind)&&Number.isSafeInteger(m.amount)&&m.amount>0&&validDate(m.date)))}
restore=async function(){const file=document.getElementById('restore').files[0];if(!file)return alert('اختر ملف النسخة الاحتياطية');try{const x=JSON.parse(await file.text());if(!validDB(x))throw Error();if(!confirm('استبدال البيانات الحالية؟ احتفظ بنسخة احتياطية أولاً.'))return;const old=db;db=x;if(!save()){db=old;return}render();alert('تم الاسترجاع')}catch(e){alert('الملف غير صالح أو غير متوافق، لم يتم استبدال البيانات')}};


function whatsappPhone(value){
 const digits=String(value||'').replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c))).replace(/[۰-۹]/g,c=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c))).replace(/[^0-9]/g,'');
 let n=digits.startsWith('00')?digits.slice(2):digits;
 if(/^07\d{9}$/.test(n))n='964'+n.slice(1);
 else if(/^7\d{9}$/.test(n))n='964'+n;
 return /^[1-9]\d{7,14}$/.test(n)?n:'';
}
function partyWhatsAppText(p){
 const lines=['مطعم وكافيه أوتار','كشف حساب: '+p.name,'تاريخ الكشف: '+datefmt(today()),'الدين الكلي: '+fmt(sum(p.movements.filter(x=>x.kind==='add'))),'مجموع التسديد: '+fmt(sum(p.movements.filter(x=>x.kind==='pay'))),'المتبقي: '+fmt(balance(p)),'','تفاصيل الحركات:'];
 p.movements.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>lines.push(datefmt(x.date)+' | '+(x.kind==='add'?'إضافة':'تسديد')+' | '+fmt(x.amount)+(x.note?' | '+x.note:'')));
 if(!p.movements.length)lines.push('لا توجد حركات');
 return lines.join('\n');
}
function sharePartyWhatsApp(pid){
 const p=db.parties.find(x=>x.id===pid);if(!p)return alert('الحساب غير موجود');
 let phone=whatsappPhone(p.phone);
 if(!phone){const entered=prompt('أدخل رقم واتساب صاحب الحساب مع رمز الدولة، مثال: 9647701234567',p.phone||'');if(entered===null)return;phone=whatsappPhone(entered);if(!phone)return alert('رقم الهاتف غير صحيح. أدخل رقم الموبايل مع رمز الدولة.');}
 window.location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(partyWhatsAppText(p));
}
const printPartyWithWhatsApp=printParty;
printParty=function(pid){
 printPartyWithWhatsApp(pid);
 const actions=document.querySelector('#statementView .actions');
 if(actions){const button=document.createElement('button');button.textContent='إرسال عبر واتساب';button.onclick=()=>sharePartyWhatsApp(pid);actions.prepend(button);}
};
